<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد کراولر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #56ab2f 0%, #a8e6cf 100%);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #fc466b 0%, #3f5efb 100%);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .status-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #333;
        }
        
        .status-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .progress-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.3s ease;
            border-radius: 10px;
        }
        
        .progress-text {
            text-align: center;
            font-weight: 600;
            color: #495057;
        }
        
        .logs-section {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        
        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .logs-container {
            background: #34495e;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(255,255,255,0.05);
        }
        
        .log-entry.error {
            background: rgba(231, 76, 60, 0.2);
            border-left: 4px solid #e74c3c;
        }
        
        .log-entry.success {
            background: rgba(46, 204, 113, 0.2);
            border-left: 4px solid #2ecc71;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 10px;
        }
        
        .status-pending { background: #f39c12; }
        .status-discovering { background: #3498db; }
        .status-crawling { background: #9b59b6; }
        .status-processing { background: #e67e22; }
        .status-completed { background: #27ae60; }
        .status-failed { background: #e74c3c; }
        .status-paused { background: #95a5a6; }
        
        .competitor-selector {
            margin-bottom: 20px;
        }
        
        .competitor-selector select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .loading {
            animation: pulse 2s infinite;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🕷️ داشبورد کراولر پیشرفته</h1>
            <p>نظارت و کنترل کرال محصولات رقبا</p>
        </div>
        
        <div class="content">
            <div class="competitor-selector">
                <select id="competitorSelect">
                    <option value="">انتخاب رقیب...</option>
                </select>
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" onclick="startCrawl()">
                    🚀 شروع کرال
                </button>
                <button class="btn btn-warning" onclick="pauseCrawl()">
                    ⏸️ توقف موقت
                </button>
                <button class="btn btn-success" onclick="resumeCrawl()">
                    ▶️ ادامه
                </button>
                <button class="btn btn-danger" onclick="stopCrawl()">
                    ⏹️ توقف کامل
                </button>
                <button class="btn btn-primary" onclick="refreshStatus()">
                    🔄 به‌روزرسانی
                </button>
            </div>
            
            <div class="status-grid">
                <div class="status-card">
                    <h3>وضعیت کرال</h3>
                    <div class="value" id="crawlStatus">
                        <span class="status-indicator status-pending"></span>
                        در انتظار
                    </div>
                </div>
                <div class="status-card">
                    <h3>محصولات کشف شده</h3>
                    <div class="value" id="discoveredCount">0</div>
                </div>
                <div class="status-card">
                    <h3>محصولات کرال شده</h3>
                    <div class="value" id="crawledCount">0</div>
                </div>
                <div class="status-card">
                    <h3>محصولات ذخیره شده</h3>
                    <div class="value" id="savedCount">0</div>
                </div>
            </div>
            
            <div class="progress-section">
                <h3>پیشرفت کرال</h3>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                <div class="progress-text" id="progressText">0%</div>
            </div>
            
            <div class="logs-section">
                <div class="logs-header">
                    <h3>📋 لاگ‌های کرال</h3>
                    <button class="btn btn-primary" onclick="clearLogs()">پاک کردن</button>
                </div>
                <div class="logs-container" id="logsContainer">
                    <div class="log-entry">در انتظار شروع کرال...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentCompetitor = '';
        let socket = null;
        
        // بارگذاری لیست رقبا
        async function loadCompetitors() {
            try {
                const response = await frappe.call({
                    method: 'frappe.client.get_list',
                    args: {
                        doctype: 'Competitor Analysis',
                        fields: ['name', 'competitor_name']
                    }
                });
                
                const select = document.getElementById('competitorSelect');
                select.innerHTML = '<option value="">انتخاب رقیب...</option>';
                
                response.message.forEach(competitor => {
                    const option = document.createElement('option');
                    option.value = competitor.name;
                    option.textContent = competitor.competitor_name || competitor.name;
                    select.appendChild(option);
                });
                
            } catch (error) {
                console.error('خطا در بارگذاری رقبا:', error);
            }
        }
        
        // تغییر رقیب
        document.getElementById('competitorSelect').addEventListener('change', function() {
            currentCompetitor = this.value;
            if (currentCompetitor) {
                refreshStatus();
                setupRealtime();
            }
        });
        
        // راه‌اندازی real-time
        function setupRealtime() {
            if (socket) {
                socket.close();
            }
            
            socket = frappe.realtime.on('crawler_log', (data) => {
                if (data.competitor === currentCompetitor) {
                    addLogEntry(data.message, data.level);
                    updateProgress(data.progress);
                }
            });
            
            frappe.realtime.on('crawler_progress', (data) => {
                updateProgress(data);
            });
            
            frappe.realtime.on('crawler_completed', (data) => {
                addLogEntry('🎉 کرال با موفقیت تکمیل شد!', 'success');
                refreshStatus();
            });
        }
        
        // شروع کرال
        async function startCrawl() {
            if (!currentCompetitor) {
                alert('لطفاً ابتدا یک رقیب انتخاب کنید');
                return;
            }
            
            try {
                const response = await frappe.call({
                    method: 'pricing.pricing.doctype.competitor_analysis.final_enhanced_crawler.start_final_crawler',
                    args: {
                        competitor_name: currentCompetitor
                    }
                });
                
                if (response.message.success) {
                    addLogEntry('🚀 کرال شروع شد', 'success');
                } else {
                    addLogEntry('❌ خطا در شروع کرال: ' + response.message.message, 'error');
                }
                
            } catch (error) {
                addLogEntry('❌ خطا در شروع کرال: ' + error.message, 'error');
            }
        }
        
        // توقف موقت کرال
        async function pauseCrawl() {
            if (!currentCompetitor) return;
            
            try {
                const response = await frappe.call({
                    method: 'pricing.pricing.doctype.competitor_analysis.final_enhanced_crawler.pause_final_crawler',
                    args: {
                        competitor_name: currentCompetitor
                    }
                });
                
                if (response.message.success) {
                    addLogEntry('⏸️ کرال متوقف شد', 'success');
                }
                
            } catch (error) {
                addLogEntry('❌ خطا در توقف کرال: ' + error.message, 'error');
            }
        }
        
        // ادامه کرال
        async function resumeCrawl() {
            if (!currentCompetitor) return;
            
            try {
                const response = await frappe.call({
                    method: 'pricing.pricing.doctype.competitor_analysis.final_enhanced_crawler.resume_final_crawler',
                    args: {
                        competitor_name: currentCompetitor
                    }
                });
                
                if (response.message.success) {
                    addLogEntry('▶️ کرال ادامه یافت', 'success');
                }
                
            } catch (error) {
                addLogEntry('❌ خطا در ادامه کرال: ' + error.message, 'error');
            }
        }
        
        // توقف کامل کرال
        async function stopCrawl() {
            if (!currentCompetitor) return;
            
            try {
                const response = await frappe.call({
                    method: 'pricing.pricing.doctype.competitor_analysis.final_enhanced_crawler.stop_final_crawler',
                    args: {
                        competitor_name: currentCompetitor
                    }
                });
                
                if (response.message.success) {
                    addLogEntry('⏹️ کرال متوقف شد', 'success');
                }
                
            } catch (error) {
                addLogEntry('❌ خطا در توقف کرال: ' + error.message, 'error');
            }
        }
        
        // به‌روزرسانی وضعیت
        async function refreshStatus() {
            if (!currentCompetitor) return;
            
            try {
                const response = await frappe.call({
                    method: 'pricing.pricing.doctype.competitor_analysis.final_enhanced_crawler.get_final_crawler_status',
                    args: {
                        competitor_name: currentCompetitor
                    }
                });
                
                if (response.message.success) {
                    updateProgress(response.message.data);
                }
                
            } catch (error) {
                console.error('خطا در دریافت وضعیت:', error);
            }
        }
        
        // به‌روزرسانی پیشرفت
        function updateProgress(data) {
            if (!data) return;
            
            // به‌روزرسانی وضعیت
            const statusElement = document.getElementById('crawlStatus');
            statusElement.innerHTML = `
                <span class="status-indicator status-${data.status}"></span>
                ${getStatusText(data.status)}
            `;
            
            // به‌روزرسانی آمار
            document.getElementById('discoveredCount').textContent = data.total_discovered || 0;
            document.getElementById('crawledCount').textContent = data.total_crawled || 0;
            document.getElementById('savedCount').textContent = data.total_saved || 0;
            
            // به‌روزرسانی نوار پیشرفت
            const progress = data.progress_percentage || 0;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = progress.toFixed(1) + '%';
        }
        
        // متن وضعیت
        function getStatusText(status) {
            const statusTexts = {
                'pending': 'در انتظار',
                'discovering': 'در حال کشف',
                'crawling': 'در حال کرال',
                'processing': 'در حال پردازش',
                'completed': 'تکمیل شده',
                'failed': 'ناموفق',
                'paused': 'متوقف شده'
            };
            return statusTexts[status] || status;
        }
        
        // افزودن لاگ
        function addLogEntry(message, level = 'info') {
            const container = document.getElementById('logsContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry ${level}`;
            
            const timestamp = new Date().toLocaleTimeString('fa-IR');
            entry.textContent = `[${timestamp}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }
        
        // پاک کردن لاگ‌ها
        function clearLogs() {
            document.getElementById('logsContainer').innerHTML = '';
        }
        
        // بارگذاری اولیه
        document.addEventListener('DOMContentLoaded', function() {
            loadCompetitors();
        });
    </script>
</body>
</html>
